name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q --cov=driftshield_mini/alerts --cov=driftshield_mini/baseline --cov=driftshield_mini/detectors --cov=driftshield_mini/embeddings.py --cov=driftshield_mini/export.py --cov=driftshield_mini/google_adk.py --cov=driftshield_mini/models.py --cov=driftshield_mini/monitor.py --cov=driftshield_mini/storage --cov-report=term-missing --cov-fail-under=75


  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run labelled benchmark
        run: python benchmarks/run_benchmark.py


  baseline-robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run baseline robustness diagnostic
        run: python benchmarks/baseline_robustness.py


  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel smoke test
        run: |
          python -m venv /tmp/driftshield-package-test
          /tmp/driftshield-package-test/bin/python -m pip install --upgrade pip
          /tmp/driftshield-package-test/bin/pip install --no-deps dist/*.whl
          /tmp/driftshield-package-test/bin/python -c "import driftshield_mini; from driftshield_mini import DriftMonitor; print(driftshield_mini.__version__)"
          /tmp/driftshield-package-test/bin/driftshield --help

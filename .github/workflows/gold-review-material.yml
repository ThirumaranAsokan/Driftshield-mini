name: Gold review validation

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  gold-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[external-validation]"
          pip install sentence-transformers

      - name: Build deterministic blinded review set
        run: |
          mkdir -p validation
          python benchmarks/build_gold_review_set.py             --limit 300             --seed 20261005             --output validation/gold_review.json

      - name: Apply frozen assistant review
        run: |
          python benchmarks/apply_gold_review.py             validation/gold_review.json             --split calibration             --output validation/gold_calibration_review.json
          python benchmarks/apply_gold_review.py             validation/gold_review.json             --split holdout             --output validation/gold_holdout_review.json

      - name: Convert reviewed trajectories
        run: |
          python benchmarks/convert_gold_review.py             validation/gold_calibration_review.json             --split calibration             --output validation/gold_calibration.json
          python benchmarks/convert_gold_review.py             validation/gold_holdout_review.json             --split holdout             --output validation/gold_holdout.json

      - name: Validate calibration split
        run: |
          python benchmarks/validate_trace_dataset.py             validation/gold_calibration.json             --output validation/gold_calibration-results.json

      - name: Validate locked holdout split
        run: |
          python benchmarks/validate_trace_dataset.py             validation/gold_holdout.json             --output validation/gold_holdout-results.json

      - name: Export label manifest without raw trajectories
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for split in ("calibration", "holdout"):
              src = json.loads(Path(f"validation/gold_{split}_review.json").read_text())
              manifest = {
                  "schema_version": src["schema_version"],
                  "dataset": src["dataset"],
                  "review_method": src["review_method"],
                  "label_status": src["label_status"],
                  "split": src["split"],
                  "sampling": src["sampling"],
                  "runs": [
                      {
                          "review_id": row["review_id"],
                          "source_index": row["source_index"],
                          "labels": row["labels"],
                          "review_reason": row["review_reason"],
                          "reviewer_id": row["reviewer_id"],
                          "review_confidence": row["review_confidence"],
                      }
                      for row in src["runs"]
                  ],
              }
              Path(f"validation/gold_{split}-labels.json").write_text(
                  json.dumps(manifest, indent=2) + "\n"
              )
          PY

      - name: Upload gold validation reports
        uses: actions/upload-artifact@v4
        with:
          name: gold-validation-results
          path: |
            validation/gold_calibration-results.json
            validation/gold_holdout-results.json
            validation/gold_calibration-labels.json
            validation/gold_holdout-labels.json
          if-no-files-found: error

      - name: Upload blinded review material for audit
        uses: actions/upload-artifact@v4
        with:
          name: gold-review-material
          path: validation/gold_review.json
          if-no-files-found: error
